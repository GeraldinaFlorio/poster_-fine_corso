<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poster Interattivo - Capitalismo e Disabilità</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 26px;
            text-align: center;
            text-transform: uppercase;
        }

        .subtitle {
            color: #7f8c8d;
            margin-top: 0;
            margin-bottom: 25px;
            font-style: italic;
            text-align: center;
        }

        /* Box contenitore del poster per gestire ombreggiatura e bordi */
        .poster-container {
            max-width: 100%;
            width: 850px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
            line-height: 0;
        }

        .poster-container img {
            width: 100%;
            height: auto;
            display: block;
            border: 4px solid #2c3e50;
            box-sizing: border-box;
        }

        .info-note {
            margin-top: 15px;
            font-size: 14px;
            color: #7f8c8d;
            text-align: center;
        }

        /* Cambia l'aspetto del puntatore del mouse quando passa sulle aree interattive */
        area {
            cursor: pointer;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/image-map-resizer/1.0.10/imageMapResizer.min.js"></script>
</head>
<body>

    <h1>Capitalismo e Disabilità</h1>
    <p class="subtitle">Navigazione Interattiva del Poster</p>

    <div class="poster-container">
        <img src="Poster con monete.jpg" usemap="#poster-map" alt="Poster con monete">
        
        <map name="poster-map">
            <area shape="rect" coords="0,0,425,270" href="1. La fabbrica della disabilità.jpg" target="_blank" alt="La fabbrica della disabilità" title="Apri: 1. La fabbrica della disabilità">
            
            <area shape="rect" coords="425,0,850,270" href="2. Il disability business.jpg" target="_blank" alt="Il disability business" title="Apri: 2. Il disability business">
            
            <area shape="rect" coords="0,270,425,510" href="3. L'illusione dei diritti.jpg" target="_blank" alt="L'illusione dei diritti" title="Apri: 3. L'illusione dei diritti">
            
            <area shape="rect" coords="425,270,850,510" href="4. Oltre la normalizzazione.jpg" target="_blank" alt="Oltre la normalizzazione" title="Apri: 4. Oltre la normalizzazione">
            
            <area shape="rect" coords="0,510,850,600" href="#" target="_blank" alt="Intervista TikToker" title="Ascolta l'intervista alla TikToker IRONADIA_301">
        </map>
    </div>

    <p class="info-note">💡 <em>Passa con il mouse sulle sezioni del poster e fai click per ingrandire i pannelli o attivare i contenuti.</em></p>

    <script>
        // Avvia il ridimensionamento dinamico della mappa all'avvio della pagina
        document.addEventListener("DOMContentLoaded", function() {
            imageMapResize();
        });
    </script>

</body>
</html>
