<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capitalismo e Disabilità - Poster Interattivo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 24px;
            text-align: center;
        }

        p.subtitle {
            color: #7f8c8d;
            margin-top: 0;
            margin-bottom: 25px;
            font-style: italic;
            text-align: center;
        }

        /* Contenitore responsivo per il poster */
        .poster-wrapper {
            max-width: 100%;
            width: 900px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
            line-height: 0; /* Rimuove lo spazio bianco sotto l'immagine */
        }

        .poster-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            border: 4px solid #2c3e50;
            box-sizing: border-box;
        }

        /* Istruzioni per l'utente */
        .info-text {
            margin-top: 15px;
            font-size: 14px;
            color: #555;
            text-align: center;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/image-map-resizer/1.0.10/imageMapResizer.min.js"></script>
</head>
<body>

    <h1>Capitalismo e Disabilità</h1>
    <p class="subtitle">Analisi Critica ed Esegesi Politico-Economica</p>

    <div class="poster-wrapper">
        <img src="poster_principale.jpg" usemap="#poster-map" alt="Poster Capitalismo e Disabilità">
        
        <map name="poster-map">
            <area shape="rect" coords="0,0,450,300" href="1. La fabbrica della disabilità.jpg" target="_blank" alt="La fabbrica della disabilità" title="Apri: La fabbrica della disabilità">
            
            <area shape="rect" coords="450,0,900,300" href="2. Il disability business.jpg" target="_blank" alt="Il disability business" title="Apri: Il disability business">
            
            <area shape="rect" coords="0,300,450,530" href="3. L'illusione dei diritti.jpg" target="_blank" alt="L'illusione dei diritti" title="Apri: L'illusione dei diritti">
            
            <area shape="rect" coords="450,300,900,530" href="4. Oltre la normalizzazione.jpg" target="_blank" alt="Oltre la normalizzazione" title="Apri: Oltre la normalizzazione">
            
            <area shape="rect" coords="0,530,900,600" href="link-al-tuo-file-audio.mp3" target="_blank" alt="Intervista Ironadia_301" title="Ascolta l'intervista a IRONADIA_301">
        </map>
    </div>

    <p class="info-text">💡 <em>Passa il mouse sopra le diverse sezioni del poster e clicca per ingrandire i capitoli o ascoltare l'audio.</em></p>

    <script>
        // Inizializza il plugin per fare in modo che le coordinate si adattino automaticamente se la pagina viene ridimensionata
        document.addEventListener("DOMContentLoaded", function() {
            imageMapResize();
        });
    </script>

</body>
</html>
